services:
  setup-playit-tool:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
    - ./:/workspace
    command: ["python", "scripts/setup-playit.py"]
    restart: "no"
  create-server-tool:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
    - ./:/workspace
    command:
    - sh
    - -ec
    - |
      pip install --quiet ruamel.yaml
      python scripts/create-server.py
    restart: "no"
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY:?Set PLAYIT_SECRET_KEY in .env}
    networks:
    - minecraft

networks:
  minecraft:
    driver: bridge
